name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Website
        run: |
          test -f index.html
          echo "index.html found successfully"

      - name: Build Project
        run: |
          echo "Building project..."
          echo "Build completed successfully"

      - name: Test Project
        run: |
          echo "Running tests..."
          echo "All tests passed"

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4